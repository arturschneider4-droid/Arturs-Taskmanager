name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name ArtursTaskmanager main.py

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ArtursTaskmanager/* -DestinationPath ArtursTaskmanager-Windows.zip -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ArtursTaskmanager-Windows
          path: ArtursTaskmanager-Windows.zip
          if-no-files-found: error

      - name: Upload EXE folder
        uses: actions/upload-artifact@v4
        with:
          name: ArtursTaskmanager-EXE
          path: dist/ArtursTaskmanager/
          if-no-files-found: error

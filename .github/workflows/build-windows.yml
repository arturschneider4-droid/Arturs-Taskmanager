name: Build Windows

on:
  push:
    branches: [ main, 'feature/v64-premium-enterprise', 'feature/v7-professional-desktop-ui', 'feature/v8-premium-enterprise-ui' ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run tests
        shell: pwsh
        run: pytest -q

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name ArtursTaskmanager --collect-submodules taskmanager --hidden-import taskmanager.v8_kanban --hidden-import taskmanager.v8_eisenhower --hidden-import taskmanager.v8_planning main.py

      - name: Verify V8 release output
        shell: pwsh
        run: |
          if (-not (Test-Path dist/ArtursTaskmanager/ArtursTaskmanager.exe)) {
            throw 'PyInstaller did not produce the expected ArtursTaskmanager.exe'
          }
          $xref = Get-Content build/ArtursTaskmanager/xref-ArtursTaskmanager.html -Raw
          foreach ($module in @('taskmanager.v8_kanban', 'taskmanager.v8_eisenhower', 'taskmanager.v8_planning')) {
            if ($xref -notmatch [regex]::Escape($module)) {
              throw "PyInstaller cross-reference does not contain $module"
            }
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ArtursTaskmanager/* -DestinationPath ArtursTaskmanager-Windows.zip -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ArtursTaskmanager-Windows
          path: ArtursTaskmanager-Windows.zip
          if-no-files-found: error

      - name: Upload EXE folder
        uses: actions/upload-artifact@v4
        with:
          name: ArtursTaskmanager-EXE
          path: dist/ArtursTaskmanager/
          if-no-files-found: error

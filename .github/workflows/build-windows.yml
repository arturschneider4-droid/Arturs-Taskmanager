name: Build Windows

on:
  push:
    branches: [ main, 'release/v10.0-final' ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Isolated Kanban regression
        shell: pwsh
        run: python -m pytest tests/v10/test_acceptance_audit.py::test_kanban_capture_and_pending_editor_cannot_reset_status -vv -s

      - name: Run tests
        shell: pwsh
        run: python -c "import ctypes, pytest; code = int(pytest.main(['-vv'])); print(f'PYTEST_EXIT_CODE={code}', flush=True); ctypes.windll.kernel32.TerminateProcess(ctypes.windll.kernel32.GetCurrentProcess(), code)"

      - name: Run V10 main-workflow smoke test
        shell: pwsh
        run: python tests/v10/windows_smoke.py

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name ArtursTaskmanager --collect-submodules taskmanager --collect-submodules openpyxl --add-data "taskmanager/assets;taskmanager/assets" --hidden-import taskmanager.weekly_review --hidden-import taskmanager.notifications --hidden-import taskmanager.calendar_view main.py

      - name: Verify V10 release output
        shell: pwsh
        run: |
          if (-not (Test-Path dist/ArtursTaskmanager/ArtursTaskmanager.exe)) {
            throw 'PyInstaller did not produce the expected ArtursTaskmanager.exe'
          }
          $xref = Get-Content build/ArtursTaskmanager/xref-ArtursTaskmanager.html -Raw
          foreach ($module in @('taskmanager.v10_shell', 'taskmanager.weekly_review', 'taskmanager.notifications', 'taskmanager.calendar_view', 'openpyxl')) {
            if ($xref -notmatch [regex]::Escape($module)) {
              throw "PyInstaller cross-reference does not contain $module"
            }
          }

      - name: Smoke-test Windows EXE startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/ArtursTaskmanager/ArtursTaskmanager.exe).Path
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            throw "ArtursTaskmanager.exe exited during startup with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - name: Smoke-test Windows DPI scaling
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/ArtursTaskmanager/ArtursTaskmanager.exe).Path
          foreach ($scale in @('1', '1.25', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
            Start-Sleep -Seconds 4
            if ($process.HasExited) { throw "EXE failed at QT_SCALE_FACTOR=$scale" }
            Stop-Process -Id $process.Id -Force
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ArtursTaskmanager/* -DestinationPath ArtursTaskmanager-V10.0-Windows.zip -Force
          $hash = (Get-FileHash ArtursTaskmanager-V10.0-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ArtursTaskmanager-V10.0-Windows.zip" | Set-Content SHA256SUMS-V10.0.txt -Encoding ascii

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ArtursTaskmanager-V10.0-Windows
          path: |
            ArtursTaskmanager-V10.0-Windows.zip
            SHA256SUMS-V10.0.txt
          if-no-files-found: error

      - name: Upload EXE folder
        uses: actions/upload-artifact@v4
        with:
          name: ArtursTaskmanager-EXE
          path: dist/ArtursTaskmanager/
          if-no-files-found: error

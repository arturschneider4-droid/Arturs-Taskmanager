name: Build Windows

on:
  push:
    branches: [ main, 'feature/v64-premium-enterprise', 'feature/v7-professional-desktop-ui', 'feature/v8-premium-enterprise-ui', 'release/v8.0-final' ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run tests
        shell: pwsh
        run: pytest -q

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name ArtursTaskmanager --collect-submodules taskmanager --collect-submodules openpyxl --hidden-import taskmanager.v8_kanban --hidden-import taskmanager.v8_eisenhower --hidden-import taskmanager.v8_planning main.py

      - name: Verify V8 release output
        shell: pwsh
        run: |
          if (-not (Test-Path dist/ArtursTaskmanager/ArtursTaskmanager.exe)) {
            throw 'PyInstaller did not produce the expected ArtursTaskmanager.exe'
          }
          $xref = Get-Content build/ArtursTaskmanager/xref-ArtursTaskmanager.html -Raw
          foreach ($module in @('taskmanager.v8_kanban', 'taskmanager.v8_eisenhower', 'taskmanager.v8_planning', 'openpyxl')) {
            if ($xref -notmatch [regex]::Escape($module)) {
              throw "PyInstaller cross-reference does not contain $module"
            }
          }

      - name: Smoke-test Windows EXE startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/ArtursTaskmanager/ArtursTaskmanager.exe).Path
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            throw "ArtursTaskmanager.exe exited during startup with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ArtursTaskmanager/* -DestinationPath ArtursTaskmanager-V8.0-Windows.zip -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ArtursTaskmanager-V8.0-Windows
          path: ArtursTaskmanager-V8.0-Windows.zip
          if-no-files-found: error

      - name: Upload EXE folder
        uses: actions/upload-artifact@v4
        with:
          name: ArtursTaskmanager-EXE
          path: dist/ArtursTaskmanager/
          if-no-files-found: error
